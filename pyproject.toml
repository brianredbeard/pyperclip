[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# This section is for poetry-specific configuration
[tool.poetry]
packages = [{include = "pyperclip", from = "src"}]

# This section is the standardized PEP 621 project metadata
[project]
name = "pyperclip"
version = "1.9.0"
description = "A cross-platform clipboard module for Python. (Only handles plain text for now.)"
authors = [
    {name = "Al Sweigart", email = "al@inventwithpython.com"},
]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*, !=3.6.*, <4.0"
keywords=["clipboard", "copy", "paste", "clip", "xsel", "xclip"]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Win32 (MS Windows)',
    'Environment :: X11 Applications',
    'Environment :: MacOS X',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 2',
    'Programming Language :: Python :: 2.7',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.5',
    'Programming Language :: Python :: 3.6',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = []

[project.urls]
Homepage = "https://github.com/asweigart/pyperclip"
Repository = "https://github.com/asweigart/pyperclip"

[project.optional-dependencies]
pyobjc = ["pyobjc-framework-Cocoa; sys_platform == 'darwin'"]
qtpy = ["qtpy; sys_platform == 'linux'"]
pyqt5 = ["PyQt5; sys_platform == 'linux'"]
dev = [
    "pytest>=6.0; python_version >= '3.8'",
    "black>=22.0; python_version >= '3.8'",
    "isort>=5.0; python_version >= '3.8'",
    "flake8>=4.0; python_version >= '3.8'",
    "mypy>=0.900; python_version >= '3.8'",
    "bandit>=1.7; python_version >= '3.8'",
    "safety>=2.0; python_version >= '3.8'",
    "coverage>=6.0; python_version >= '3.8'",
]
