---
# Release workflow for pyperclip
# Triggers on tag creation and builds release artifacts
name: Release
on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        # Corrected description to be clear about the expected format.
        description: Tag to release (e.g., 1.9.0). Do not include the "v" prefix.
        required: true
        type: string
jobs:
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Determine tag name
        id: get_tag
        run: |
          # This step unifies the tag name whether the workflow was triggered
          # by a push event or a manual dispatch.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=v${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_tag.outputs.tag_name }}
          fetch-depth: 0  # Full history is needed for some versioning tools
      - name: Get version from tag
        id: get_version
        run: |
          # Extracts the version number from the tag (e.g., "v1.9.0" -> "1.9.0")
          # and makes it available to other jobs.
          VERSION=$(echo "${{ steps.get_tag.outputs.tag_name }}" | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for version: $VERSION"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.5.1
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv --python 3.11
      - name: Install build dependencies
        run: |
          uv pip install build twine wheel setuptools
      - name: Build source distribution and wheel
        run: |
          uv run python -m build
      - name: Check distributions
        run: |
          uv run twine check dist/*
      - name: List built artifacts for verification
        # This diagnostic step logs the contents of the dist/ directory
        # to make debugging build issues easier.
        run: ls -l dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
  test-release:
    name: Test release on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: build-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.11', '3.12']
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.5.1
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - name: Create virtual environment for testing
        run: uv venv test-env --python ${{ matrix.python-version }}
      - name: Install from wheel and test (Unix)
        if: runner.os != 'Windows'
        run: |
          # This step tests the actual wheel artifact from a clean environment,
          # which is a more accurate simulation of a user installation.
          ./test-env/bin/uv pip install ./dist/*.whl
          ./test-env/bin/python -c "import pyperclip; print('Pyperclip version ${{ needs.build-release.outputs.version }} installed and imported successfully')"
      - name: Install from wheel and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows-specific path for the test environment.
          ./test-env/Scripts/uv.exe pip install ./dist/*.whl
          ./test-env/Scripts/python.exe -c "import pyperclip; print('Pyperclip version ${{ needs.build-release.outputs.version }} installed and imported successfully')"
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-release, test-release]
    # Guard Rail: This job runs if:
    # 1. It's on the main repository, AND
    # 2. It was triggered by EITHER a tag push OR a manual dispatch.
    # This fixes the bug where manual releases would never be published.
    if: >
      github.repository == 'asweigart/pyperclip' && (github.event_name ==
      'push' || github.event_name == 'workflow_dispatch')
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
      - name: List files to be published
        # This diagnostic step logs the files that will be uploaded to PyPI.
        run: ls -l dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.10.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
