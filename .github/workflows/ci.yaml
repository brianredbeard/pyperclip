---
# Main CI/CD pipeline for pyperclip
# Runs on push to main/master and on pull requests
# Tests across multiple Python versions and platforms
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            runs-on: ubuntu-latest
            python-version: '3.8'
            arch: amd64
          - os: linux
            runs-on: ubuntu-latest
            python-version: '3.9'
            arch: amd64
          - os: linux
            runs-on: ubuntu-latest
            python-version: '3.10'
            arch: amd64
          - os: linux
            runs-on: ubuntu-latest
            python-version: '3.11'
            arch: amd64
          - os: linux
            runs-on: ubuntu-latest
            python-version: '3.12'
            arch: amd64

          # Linux ARM64 (using self-hosted or larger runners)
          # Note: GitHub hosted runners don't support ARM64 Linux
          # Uncomment these if you have ARM64 self-hosted runners
          # - os: linux
          #   runs-on: [self-hosted, linux, arm64]
          #   python-version: "3.11"
          #   arch: arm64
          # - os: linux
          #   runs-on: [self-hosted, linux, arm64]
          #   python-version: "3.12"
          #   arch: arm64
          # macOS AMD64
          - os: macos
            runs-on: macos-13  # Intel-based
            python-version: '3.10'
            arch: amd64
          - os: macos
            runs-on: macos-13
            python-version: '3.11'
            arch: amd64
          - os: macos
            runs-on: macos-13
            python-version: '3.12'
            arch: amd64

          # macOS ARM64 (Apple Silicon)
          - os: macos
            runs-on: macos-latest  # Apple Silicon
            python-version: '3.10'
            arch: arm64
          - os: macos
            runs-on: macos-latest
            python-version: '3.11'
            arch: arm64
          - os: macos
            runs-on: macos-latest
            python-version: '3.12'
            arch: arm64

          # Windows AMD64
          - os: windows
            runs-on: windows-latest
            python-version: '3.8'
            arch: amd64
          - os: windows
            runs-on: windows-latest
            python-version: '3.10'
            arch: amd64
          - os: windows
            runs-on: windows-latest
            python-version: '3.11'
            arch: amd64
          - os: windows
            runs-on: windows-latest
            python-version: '3.12'
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.5.1  # Pin to specific version for reproducibility
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Activate virtual environment (Unix)
        if: runner.os != 'Windows'
        run: echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV && echo ".venv/bin" >> $GITHUB_PATH
      - name: Activate virtual environment (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VIRTUAL_ENV=.venv" >> $env:GITHUB_ENV
          echo ".venv\\Scripts" >> $env:GITHUB_PATH
      - name: Install project dependencies
        run: |
          uv pip install -e ".[dev]"
      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xsel
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          # pbcopy/pbpaste should be available by default on macOS
          which pbcopy || echo "pbcopy not found"
          which pbpaste || echo "pbpaste not found"
      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short
      - name: Run type checking (if mypy is available)
        run: |
          uv pip list | grep mypy && uv run mypy src/pyperclip/ || echo "mypy not available, skipping type checking"
      - name: Test import and basic functionality
        run: |
          uv run python -c "import pyperclip; print('Pyperclip imported successfully')"
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.5.1
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv --python 3.11
      - name: Install development dependencies
        run: |
          uv pip install black isort flake8 mypy
      - name: Check code formatting with black
        run: |
          uv run black --check --diff src/ tests/
      - name: Check import sorting with isort
        run: |
          uv run isort --check-only --diff src/ tests/
      - name: Lint with flake8
        run: |
          uv run flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503
      - name: Type check with mypy
        run: |
          uv run mypy src/pyperclip/
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.5.1
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install security tools
        run: |
          uv tool install bandit
          uv tool install safety
      - name: Run bandit security scan
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json || true
      - name: Run safety check
        run: |
          uv run safety check --json --output safety-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |-
            bandit-report.json
            safety-report.json
